apiVersion: apps/v1
kind: Deployment
metadata:
  name: chimera-api
  namespace: chimera
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chimera-api
  template:
    metadata:
      labels:
        app: chimera-api
    spec:
      containers:
      - name: chimera-api
        image: project-chimera:latest
        ports:
        - containerPort: 8000
        - containerPort: 3000
        env:
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: POSTGRES_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: REDIS_URL
        - name: WEAVIATE_URL
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: WEAVIATE_URL
        - name: WEAVIATE_API_KEY
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: WEAVIATE_API_KEY
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: GEMINI_API_KEY
        - name: NEWSDATA_API_KEY
          valueFrom:
            secretKeyRef:
              name: chimera-secrets
              key: NEWSDATA_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
