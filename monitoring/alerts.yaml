# Prometheus alert rules for Project Chimera
# Use with Prometheus operator or prometheus.yml rule_files
groups:
  - name: chimera-api
    rules:
      - alert: ChimeraAPIDown
        expr: up{job="chimera-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Chimera API is down"
          description: "Instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on Chimera API"

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API latency p95 above 2s"

  - name: chimera-dependencies
    rules:
      - alert: DatabaseDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis is down"
