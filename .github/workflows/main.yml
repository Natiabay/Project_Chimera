name: Project Chimera CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check app/ skills/ tests/ --output-format=github
      - name: Ruff format check
        run: ruff format --check app/ skills/ tests/ || true

  test:
    name: Test (host)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m pytest tests/ -v

      - name: Run spec-check
        run: make spec-check

  docker-build:
    name: Build & test in Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t project-chimera:latest .

      - name: Run tests inside Docker
        run: docker run --rm --entrypoint pytest project-chimera:latest tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TruffleHog (secrets scan)
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}

      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-results.json || true

  ai-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: AI Review Policy Check
        run: |
          echo "Checking for AI governance policies..."
          [ -f .cursor/rules/project_chimera.mdc ] && echo "✅ Cursor rules found" || echo "❌ Cursor rules missing"
          [ -f .coderabbit.yaml ] && echo "✅ CodeRabbit config found" || echo "❌ CodeRabbit config missing"
          echo "AI governance check completed."
